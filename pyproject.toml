[project]
name = 'real-time-captions'
version = '0.1.0'
description = 'Portable real-time captions core.'
authors = [
    { name = 'Adam Jaworski' },
]
requires-python = '>=3.12,<3.13'
dependencies = [
    'numpy<2.0.0',
    'scipy>=1.14',
]

[dependency-groups]
dev = [
    'pytest>=8.3',
    'pytest-cov>=6.0',
]
windows-audio = [
    "PyAudioWPatch==0.2.12.8; sys_platform == 'win32'",
    "proc-tap==1.0.3; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "psutil>=7.0,<8; sys_platform == 'win32'",
]

[project.scripts]
real-time-captions = 'real_time_captions:main'

[build-system]
requires = ['uv_build>=0.10.0,<0.11.0']
build-backend = 'uv_build'
